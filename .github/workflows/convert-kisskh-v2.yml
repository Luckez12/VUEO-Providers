name: Convert KissKH v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vueo-convert-kisskh-v2
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout VUEO Providers
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current CloudStream source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/cloudstream-source"
          git clone             --depth 1             https://github.com/Luckez12/Cloudstream-Repo.git             "$RUNNER_TEMP/cloudstream-source"

      - name: Install KissKH converter adapter
        shell: bash
        env:
          ADAPTER_B64: 
          TEMPLATE_B64: 
          MOCK_B64: 
          LIVE_B64: 
        run: |
          set -euo pipefail

          mkdir -p             tools/cloudstream-converter/adapters             tools/cloudstream-converter/templates             generated/kisskh             scripts

          printf '%s' "$ADAPTER_B64" | base64 -d             > tools/cloudstream-converter/adapters/kisskh.py

          printf '%s' "$TEMPLATE_B64" | base64 -d             > tools/cloudstream-converter/templates/kisskh.js

          printf '%s' "$MOCK_B64" | base64 -d             > scripts/test-kisskh-v2.cjs

          printf '%s' "$LIVE_B64" | base64 -d             > scripts/live-kisskh-v2.cjs

          chmod +x             tools/cloudstream-converter/adapters/kisskh.py

      - name: Generate KissKH from Kotlin
        shell: bash
        run: |
          set -euo pipefail

          python3             tools/cloudstream-converter/adapters/kisskh.py             --source "$RUNNER_TEMP/cloudstream-source"             --template tools/cloudstream-converter/templates/kisskh.js             --output generated/kisskh

      - name: Validate generated provider
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile             tools/cloudstream-converter/adapters/kisskh.py

          python3 -m json.tool             generated/kisskh/analysis.json             >/dev/null

          node --check             generated/kisskh/provider.generated.js

          node --check             scripts/test-kisskh-v2.cjs

          if grep -Eq '\basync\b|\bawait\b'             generated/kisskh/provider.generated.js; then
            echo "::error::Generated runtime must remain Promise based."
            exit 1
          fi

          grep -Fq             'KISSKH_VERSION = "2.8.10"'             generated/kisskh/provider.generated.js

          grep -Fq             '/api/DramaList/Search'             generated/kisskh/provider.generated.js

          grep -Fq             '/api/DramaList/Episode/'             generated/kisskh/provider.generated.js

      - name: Deterministic KissKH converter test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-kisskh-v2.cjs

      - name: Live KissKH smoke test
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/live-kisskh-v2.cjs

      - name: Record converter status
        shell: bash
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("generated/kisskh/analysis.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          data["workflow"] = {
              "mockTest": "passed",
              "liveSmoke": os.environ.get("LIVE_OUTCOME", "not-run"),
              "promotedToProviders": False,
          }

          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit generated KissKH
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             tools/cloudstream-converter/adapters/kisskh.py             tools/cloudstream-converter/templates/kisskh.js             generated/kisskh             scripts/test-kisskh-v2.cjs             scripts/live-kisskh-v2.cjs

          git commit -m             "Generate KissKH with converter v2"

          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        shell: bash
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          {
            echo "## KissKH Converter v2"
            echo
            echo "- Extracts live constants from KissKH.kt"
            echo "- Generates search, detail, episode and key API logic"
            echo "- Supports direct HLS, MP4 and DASH sources"
            echo "- Supports English, Malay and Indonesian subtitle URLs"
            echo "- Third party extractor hosts are not promoted yet"
            echo "- Encrypted .txt subtitle interception is not converted yet"
            echo "- generated/kisskh stays separate from providers/kisskh.js"
            echo "- Live smoke outcome: \`${LIVE_OUTCOME:-not-run}\`"
          } >> "$GITHUB_STEP_SUMMARY"
