      - name: Update manifest and port status
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("manifest.json")
          manifest = json.loads(
              path.read_text(encoding="utf-8")
          )

          if isinstance(manifest.get("scrapers"), list):
              key = "scrapers"
          elif isinstance(manifest.get("providers"), list):
              key = "providers"
          else:
              raise SystemExit(
                  "manifest.json has no scrapers/providers list"
              )

          moviebox = next(
              (
                  item
                  for item in manifest[key]
                  if str(item.get("id", "")).lower()
                  == "moviebox"
              ),
              None,
          )

          if moviebox is None:
              raise SystemExit(
                  "MovieBox is missing from manifest.json"
              )

          moviebox.update(
              {
                  "version": "1.1.0",
                  "enabled": True,
                  "filename": "providers/moviebox.js",
                  "description":
                      "MovieBox v1.1 with H5 V2 resolver, "
                      "multi-host playback and device diagnostics.",
                  "supportedTypes": ["movie", "tv"],
                  "contentLanguage": ["en", "id", "ms"],
                  "supportsExternalPlayer": True,
              }
          )

          manifest["version"] = "0.2.1"

          path.write_text(
              json.dumps(
                  manifest,
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )

          status = Path("PORTING_STATUS.md")

          if status.exists():
              text = status.read_text(
                  encoding="utf-8"
              )

              replacement = (
                  "| MovieBox | `moviebox` | "
                  "v1.1 diagnostic resolver | Enabled |"
              )

              pattern = re.compile(
                  r"^\|\s*MovieBox\s*\|.*$",
                  re.MULTILINE,
              )

              if pattern.search(text):
                  text = pattern.sub(
                      replacement,
                      text,
                      count=1,
                  )
              else:
                  text += "\n" + replacement + "\n"

              status.write_text(
                  text,
                  encoding="utf-8",
              )

          print("Manifest updated to MovieBox 1.1.0.")
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail

          node --check providers/moviebox.js
          node --check scripts/test-moviebox-v1.1.cjs
          node --check scripts/live-moviebox-v1.1.cjs
          python3 -m json.tool manifest.json >/dev/null

          grep -Fq             'MOVIEBOX_TMDB_TIMEOUT_MS = 11000'             providers/moviebox.js

          grep -Fq             'https://h5-api.aoneroom.com'             providers/moviebox.js

          grep -Fq             'https://h5.aoneroom.com'             providers/moviebox.js

          grep -Fq             'detailPath='             providers/moviebox.js

          grep -Fq             '[MovieBox][diag] stage='             providers/moviebox.js

          if grep -Eq '\basync\b|\bawait\b'             providers/moviebox.js; then
            echo "::error::Runtime provider must remain Promise based."
            exit 1
          fi

          python3 <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("manifest.json").read_text(
                  encoding="utf-8"
              )
          )

          items = (
              manifest.get("scrapers")
              or manifest.get("providers")
              or []
          )

          moviebox = next(
              (
                  item
                  for item in items
                  if item.get("id") == "moviebox"
              ),
              None,
          )

          assert moviebox is not None
          assert moviebox.get("version") == "1.1.0"
          assert moviebox.get("enabled") is True
          assert (
              moviebox.get("filename")
              == "providers/moviebox.js"
          )

          print("Manifest validation passed.")
          PY

      - name: Deterministic MovieBox v1.1 test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-moviebox-v1.1.cjs

      - name: Live MovieBox diagnostic smoke test
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/live-moviebox-v1.1.cjs

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             manifest.json             providers/moviebox.js             scripts/test-moviebox-v1.1.cjs             scripts/live-moviebox-v1.1.cjs             src/moviebox/README.md

          if [ -f PORTING_STATUS.md ]; then
            git add PORTING_STATUS.md
          fi

          git commit -m             "Fix MovieBox resolver diagnostics v1.1"

          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        shell: bash
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          {
            echo "## MovieBox v1.1"
            echo
            echo "- TMDB resolver timeout: 11 seconds"
            echo "- Search primary: H5 V2 API"
            echo "- Search fallback: MovieBox web mirrors"
            echo "- Playback primary: h5.aoneroom.com"
            echo "- Playback shapes: streams, HLS, DASH"
            echo "- Diagnostic stages: tmdb, search, play, caption"
            echo "- Live smoke outcome: \`${LIVE_OUTCOME:-not-run}\`"
            echo
            echo "If device health still fails, the provider now rejects with the failed stage instead of returning only an empty array."
          } >> "$GITHUB_STEP_SUMMARY"
